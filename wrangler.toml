name = "oism-institute"
main = "worker.js"
compatibility_date = "2025-02-01"

[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
LAPTOP_TUNNEL_URL = "https://laptop-origin.oism.institute"
GITHUB_PAGES_MIRROR_URL = "https://shangle.github.io/oism.institute"
GITHUB_REPO = "shangle/oism.institute"

[ai]
binding = "AI"

